<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recovery Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-700 rounded-3xl shadow-2xl p-8">
        
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto rounded-full bg-amber-500/10 flex items-center justify-center animate-spin-slow">
                <i data-lucide="refresh-cw" class="w-10 h-10 text-amber-400"></i>
            </div>
            <h1 class="text-2xl font-bold mt-4">Memeriksa Kredensial</h1>
            <p class="text-slate-400 text-sm mt-2">
                Cloud sedang menghubungi penyedia...
            </p>
        </div>

        <div class="mb-6">
            <div class="flex justify-between text-sm mb-2">
                <span>Status Recovery</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                <div id="progress-bar" class="bg-amber-400 h-3 rounded-full transition-all duration-500" style="width:0%"></div>
            </div>
        </div>

        <div class="bg-black rounded-2xl p-4 font-mono text-sm text-green-400 h-48 overflow-hidden border border-slate-800">
            <div id="terminal"></div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-6">
            <button onclick="retryRecovery()" class="bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-2xl transition">
                Retry
            </button>
            <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-700 py-3 rounded-2xl transition">
                Refresh Config
            </button>
        </div>

        <p class="text-center text-xs text-slate-500 mt-6">
            “Cloud sedang ngopi dulu ☕”
        </p>
    </div>

    <style>
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 4s linear infinite;
        }
    </style>

    <script>
        lucide.createIcons();

        const logs = [
    "Menginisialisasi node penyimpanan...",
    "Memeriksa kredensial API...",
    "Validasi token gagal, mencoba ulang...",
    "Menyinkronkan cluster cadangan...",
    "Memulihkan sesi cloud...",
    "Menghubungkan ulang ke endpoint utama...",
    "Pemulihan berhasil diselesaikan."
];

        let progress = 0;
        let logIndex = 0;

        function updateRecovery() {
            if (progress < 100) {
                progress += Math.floor(Math.random() * 15) + 5;
                if (progress > 100) progress = 100;

                document.getElementById("progress-bar").style.width = progress + "%";
                document.getElementById("progress-text").textContent = progress + "%";

                if (logIndex < logs.length) {
                    const terminal = document.getElementById("terminal");
                    const line = document.createElement("div");
                    line.textContent = "> " + logs[logIndex];
                    terminal.appendChild(line);
                    terminal.scrollTop = terminal.scrollHeight;
                    logIndex++;
                }

                if (progress < 100) {
                    setTimeout(updateRecovery, 1500);
                }
            }
        }

        function retryRecovery() {
            progress = 0;
            logIndex = 0;
            document.getElementById("terminal").innerHTML = "";
            document.getElementById("progress-bar").style.width = "0%";
            document.getElementById("progress-text").textContent = "0%";
            updateRecovery();
        }

        updateRecovery();
    </script>
</body>
</html>
